name: QA

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write

jobs:
  qa:
    name: QA
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QA dependencies
        run: npm ci --prefix qa

      - name: Install web dependencies
        run: npm ci --prefix apps/client/web

      - name: Install mobile dependencies
        run: npm ci --prefix apps/client/mobile

      - name: Install server dependencies
        run: python -m pip install -r apps/server/requirements.txt

      - name: Run QA lint
        id: lint
        run: npm --prefix qa run lint

      - name: Run QA typecheck
        id: typecheck
        run: npm --prefix qa run typecheck

      - name: Run QA unit test
        id: unit_test
        run: npm --prefix qa run test:unit

      - name: Run QA regression test
        id: regression_test
        run: npm --prefix qa run test:regression

      - name: Write QA summary
        if: always()
        env:
          QA_LINT_OUTCOME: ${{ steps.lint.outcome }}
          QA_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          QA_UNIT_OUTCOME: ${{ steps.unit_test.outcome }}
          QA_REGRESSION_OUTCOME: ${{ steps.regression_test.outcome }}
          QA_SUMMARY_FILE: ${{ runner.temp }}/qa-summary.md
        run: node .\qa\scripts\write-qa-summary.mjs

      - name: Write PR QA comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          QA_SUMMARY_FILE: ${{ runner.temp }}/qa-summary.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- qa-summary-comment -->";
            const summaryPath = process.env.QA_SUMMARY_FILE;
            const summaryText = fs.readFileSync(summaryPath, "utf8");
            const commentBody = `${marker}\n${summaryText}`;
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            );

            const existingComment = comments.find((comment) => {
              return comment.user.type === "Bot" && comment.body && comment.body.includes(marker);
            });

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: commentBody,
            });
